name: CI
on: [push, pull_request]
# The workflow only reads the code: the token it gets can't push or change the repo.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: node tests/math.test.mjs
      - run: node tests/api.test.js
      - run: node tests/gestures.test.mjs
      - run: node tests/cast.test.mjs
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python desktop/tests/test_engine.py
      - run: bash -n desktop/install.sh
      # The website serves a copy of the desktop app for its installer: it must match desktop/
      # (a dependency bump in desktop/requirements.txt needs `bash scripts/build-desktop.sh`).
      - run: bash scripts/build-desktop.sh && git diff --exit-code -- public/desktop desktop/install.sh
